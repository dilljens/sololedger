name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production VPS
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: 40.160.241.74
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Deploying sololedger..."
            cd /opt/sololedger/deploy
            git pull origin main
            docker compose up -d --build

            # Wait for the API to actually come up before declaring success
            for i in $(seq 1 15); do
              if curl -fs http://localhost:8100/api/v1/health; then
                echo "Health check passed"
                break
              fi
              echo "Waiting for API... ($i/15)"
              sleep 2
              if [ "$i" = "15" ]; then
                echo "API failed to become healthy" >&2
                exit 1
              fi
            done

            echo "✅ Deploy complete"
            echo "   API:  http://$(curl -s ifconfig.me):8100/api/v1/health"
            echo "   App:  http://$(curl -s ifconfig.me):8100/app/"
