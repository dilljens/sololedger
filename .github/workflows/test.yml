name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3-dev 2>/dev/null || true
          pip install -r requirements-test.txt

      - name: Lint with compile-check
        run: |
          python -c "
          import py_compile, glob, os
          files = glob.glob('app/**/*.py', recursive=True)
          for f in sorted(files):
              py_compile.compile(f, doraise=True)
          print(f'All {len(files)} files compile OK')
          "

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=long -x --paste=mypaste 2>&1 | tee /tmp/test-output.txt
          exit ${PIPESTATUS[0]}

      - name: Show failure in summary
        if: failure()
        run: |
          echo "## Test Failure (${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/test-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.python-version }}
          path: /tmp/test-output.txt

      - name: Verify ledger integrity
        run: |
          python -m app.main check

  e2e:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libcairo2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install pytest-playwright

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium

      - name: Run E2E tests
        run: |
          PLAYWRIGHT_HEADLESS=1 python -m pytest e2e/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: test-results/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JS files compile
        run: |
          files=$(find web/js -name '*.js' | sort)
          for f in $files; do
            node --check "$f"
            echo "  ✓ $f"
          done
          count=$(echo "$files" | wc -l)
          echo "All $count JS files pass syntax check"

      - name: Check CSS files exist and are non-empty
        run: |
          wc -l web/css/*.css
