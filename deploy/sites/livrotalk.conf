# LivroTalk — managed by livrotalk repo deploy
livrotalk.ferrumeng.com {
    root * /var/www/livrotalk

    handle /api/* {
        reverse_proxy 127.0.0.1:8001
    }

    handle /audio/* {
        reverse_proxy 127.0.0.1:8001
    }

    handle /files/* {
        reverse_proxy 127.0.0.1:8001
    }

    handle /health {
        reverse_proxy 127.0.0.1:8001
    }

    # TTS via Kokoro-FastAPI (strip /tts/ prefix before forwarding)
    @tts {
        path_regexp ttsroute ^/tts/
    }
    handle @tts {
        uri strip_prefix /tts
        reverse_proxy 127.0.0.1:8880
    }

    handle {
        file_server
        try_files {path} /index.html
    }
}
