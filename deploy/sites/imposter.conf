# Imposter IRL — Next.js frontend + self-hosted Supabase API on one domain
# (same-origin, no CORS needed).
# Frontend: /opt/imposter-frontend (:3100, imposter-frontend.service)
# API tables: PostgREST (:3000) via imposter-backend stack
# Realtime: supabase/realtime (:4000) via imposter-backend stack
irl.talk-edit.com {
    handle /rest/v1/* {
        reverse_proxy 127.0.0.1:3000
    }

    handle /realtime/v1/* {
        reverse_proxy 127.0.0.1:4000
    }

    handle {
        reverse_proxy 127.0.0.1:3100
    }
}
