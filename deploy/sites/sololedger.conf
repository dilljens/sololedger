# SoloLedger — managed by sololedger repo deploy
sololedger.ferrumeng.com {
    # Root serves the marketing landing page (FastAPI returns web/landing.html).
    # /app/ and /app/* proxy to the API, which mounts the Vue app.
    handle /app/* {
        reverse_proxy 127.0.0.1:8100
    }

    handle /api/* {
        reverse_proxy 127.0.0.1:8100
    }

    handle /docs* {
        reverse_proxy 127.0.0.1:8100
    }

    handle /openapi.json {
        reverse_proxy 127.0.0.1:8100
    }

    handle {
        reverse_proxy 127.0.0.1:8100
    }
}
