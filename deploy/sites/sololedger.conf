# SoloLedger — managed by sololedger repo deploy
sololedger.ferrumeng.com {
    @api path /api/*
    handle @api {
        reverse_proxy 127.0.0.1:8100
    }

    @docs path /docs* /openapi.json
    handle @docs {
        reverse_proxy 127.0.0.1:8100
    }

    # Everything else (landing page, SPA, static assets)
    handle {
        reverse_proxy 127.0.0.1:8100
    }
}
