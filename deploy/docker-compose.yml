# Ferrum Engineering — Production stack for VPS
#
# Serves:
#   sololedger.ferrumeng.com  →  SoloLedger API + SPA
#   poolsplat.ferrumeng.com    →  PoolSplat 3D viewer + API
#
# Prerequisites:
#   git clone https://github.com/dilljens/sololedger /opt/sololedger
#   git clone https://github.com/dilljens/poolsplat /opt/poolsplat
#   cd /opt/sololedger/deploy
#   cp .env.example .env
#   nano .env          # fill in secrets
#   docker compose up -d

services:

  # ── SoloLedger API + SPA ─────────────────────────────────────────
  sololedger-api:
    build:
      context: /opt/sololedger
      dockerfile: Dockerfile.api
    container_name: sololedger-api
    restart: unless-stopped
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - /opt/sololedger/config.toml:/app/config.toml:ro
      - output_data:/app/output
      - imports_data:/app/imports
      # CRITICAL: app.db + tenant ledgers live under SOLOLEDGER_DATA_DIR —
      # a named volume so accounts/sessions/ledgers survive rebuilds.
      - sololedger_data:/data
    environment:
      - API_PORT=8100
      - API_CONFIG=/app/config.toml
      # All user/tenant data (app.db, ledgers/) in the persistent volume
      - SOLOLEDGER_DATA_DIR=/data
      # Fail-closed: unauthenticated access is REJECTED unless this is set.
      # Never set it in production.
      - SOLOLEDGER_OPEN_MODE=false
      - SOLOLEDGER_REQUIRE_EMAIL_VERIFY=true
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM=${RESEND_FROM:-SoloLedger <welcome@sololedger.ferrumeng.com>}
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID:-}
      - PLAID_SECRET=${PLAID_SECRET:-}
      - PLAID_ACCESS_TOKEN=${PLAID_ACCESS_TOKEN:-}
      - PLAID_ENV=${PLAID_ENV:-sandbox}
      - TOGGL_API_TOKEN=${TOGGL_API_TOKEN:-}
      - NOTIFY_SMTP_PASSWORD=${NOTIFY_SMTP_PASSWORD:-}
      - SL_HOST_DOMAIN=${SL_HOST_DOMAIN:-sololedger.ferrumeng.com}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - APP_URL=${APP_URL:-https://sololedger.ferrumeng.com}
      - UVICORN_WORKERS=${UVICORN_WORKERS:-1}

  # ── PoolSplat 3D viewer + AI photo editor ────────────────────────
  poolsplat:
    build:
      context: /opt/poolsplat
      dockerfile: Dockerfile
    container_name: poolsplat
    restart: unless-stopped
    ports:
      - "127.0.0.1:3138:3138"
    volumes:
      - poolsplat_scenes:/root/.poolsplat/scenes
    environment:
      - POOLSPLAT_PORT=3138
      - FAL_KEY=${FAL_KEY:-}
      # AI photo editor backends (values from .env, gitignored)
      - AGNES_API_KEY=${AGNES_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NODE_ENV=production

  # ── Caddy — reverse proxy + auto TLS ─────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: ferrum-caddy
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - /var/www/scripture/frontend/dist:/var/www/scripture:ro
      - /var/www/livrotalk/frontend/dist:/var/www/livrotalk:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - sololedger-api
      - poolsplat

  # ── Netdata — system monitoring + alerts ──────────────────────────
  netdata:
    image: netdata/netdata:latest
    container_name: netdata
    restart: unless-stopped
    hostname: ferrum-vps
    network_mode: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
    environment:
      - NETDATA_EMAIL_SEND=${NETDATA_EMAIL_SEND:-}
      - NETDATA_EMAIL_TO=${NETDATA_EMAIL_TO:-dillon@ferrumengineeringllc.com}
      - PGID=999
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  output_data:
  imports_data:
  poolsplat_scenes:
  netdata_config:
  netdata_lib:
  netdata_cache:
  caddy_data:
  caddy_config:
  sololedger_data:
