<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SoloLedger</title>
  <meta name="theme-color" content="#3b82f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Open-source accounting, invoicing, and tax tools for your consulting LLC">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Open Graph -->
  <meta property="og:title" content="SoloLedger">
  <meta property="og:description" content="Open-source accounting, invoicing, and tax tools for your consulting LLC">
  <meta property="og:type" content="website">
  <!-- CSP: 'self' + Google Identity Services (GSI loads from
       accounts.google.com) + umami analytics. No inline handlers in the
       Vue app, so no 'unsafe-inline' for scripts. Vite carries this meta
       into the built index. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com https://umami.ferrumeng.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://umami.ferrumeng.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="manifest" href="/app/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/app/favicon.svg">
  <link rel="apple-touch-icon" sizes="152x152" href="/app/icon-152.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,700;9..144,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app/css/style.css?v=3">
</head>
<body>
  <!-- Skip to content link -->
  <a href="#main-content" class="skip-link">Skip to content</a>

  <!-- Visually-hidden page title -->
  <h1 class="sr-only">SoloLedger — Business Accounting</h1>

  <div id="app"></div>
  <!-- Google Identity Services (renders the Google sign-in button) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Umami analytics — https://umami.ferrumeng.com -->
  <script defer src="https://umami.ferrumeng.com/script.js" data-website-id="c70463b6-ba32-4d1d-b5ed-85614d689862"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
