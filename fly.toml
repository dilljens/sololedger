# Fly.io deployment config for SoloLedger
# Deploy: fly launch --copy-config --no-deploy && fly deploy
app = "sololedger"

[build]
  dockerfile = "Dockerfile.api"

[http_service]
  internal_port = 8100
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[env]
  API_PORT = "8100"
  API_CONFIG = "/app/config.toml"
  PYTHONUNBUFFERED = "1"
